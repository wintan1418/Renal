# Solid Queue recurring job configuration
# See: https://github.com/rails/solid_queue

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  generate_recurring_appointments:
    class: RecurringAppointmentGeneratorJob
    queue: default
    schedule: at 2am every day

  send_appointment_reminders:
    class: AppointmentReminderJob
    queue: default
    schedule: at 8am every day

  mark_no_shows:
    class: NoShowMarkerJob
    queue: default
    schedule: at 11pm every day
